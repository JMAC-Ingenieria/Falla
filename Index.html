<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confiabilidad Estructural | Simulador</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Panel Principal (Izquierda) */
        .main-panel {
            flex: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 2px solid #ddd;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.2em;
            margin-top: 10px;
        }

        /* Máquina Tragamonedas */
        .slot-machine {
            background-color: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .slot {
            width: 120px;
            height: 150px;
            background-color: #ecf0f1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: inset 5px #bdc3c7;
            transition: all 0.1s ease;
        }

        /* Botón / Palanca */
        .lever-btn {
            background-color: #e74c3c;
            color: white;
            font-size: 1.5em;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.1s;
            font-weight: bold;
            text-transform: uppercase;
        }

        .lever-btn:active {
            box-shadow: 0 2px 0 #c0392b;
            transform: translateY(4px);
        }

        .lever-btn:disabled {
            background-color: #95a5a6;
            box-shadow: 0 6px 0 #7f8c8d;
            cursor: not-allowed;
        }

        /* Historial (Derecha) */
        .history-panel {
            flex: 3;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .history-panel h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .status-safe {
            color: #27ae60;
            font-weight: bold;
        }

        .status-fail {
            color: #e74c3c;
            font-weight: bold;
            background-color: #fadbd8;
            padding: 5px 10px;
            border-radius: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Panel de Simulación -->
    <div class="main-panel">
        <div class="header">
            <h1>Probabilidad de Falla Estructural</h1>
            <p>Probabilidad de colapso: 1 en 100,000</p>
        </div>

        <div class="slot-machine" id="machine">
            <div class="slot" id="slot1">🌉</div>
            <div class="slot" id="slot2">🌉</div>
            <div class="slot" id="slot3">🌉</div>
        </div>

        <button class="lever-btn" id="leverBtn">Tirar de la palanca</button>
        
        <p id="globalStats" style="margin-top: 20px; font-weight: bold; color: #7f8c8d;">
            Ensayos totales: <span id="counter">0</span>
        </p>
    </div>

    <!-- Panel de Historial (Log) -->
    <div class="history-panel">
        <h2>Historial de Pruebas</h2>
        <ul class="history-list" id="historyList">
            <!-- Los resultados aparecerán aquí -->
        </ul>
    </div>

    <script>
        const btn = document.getElementById('leverBtn');
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const historyList = document.getElementById('historyList');
        const counterSpan = document.getElementById('counter');

        // Símbolos de operación normal
        const safeSymbols = ['🌉', '🚚', '🏗️', '☀️', '💨'];
        const failSymbol = '💥'; // Símbolo de falla

        let totalAttempts = 0;

        btn.addEventListener('click', () => {
            // Deshabilitar botón mientras "gira"
            btn.disabled = true;
            btn.innerText = "Calculando...";
            
            let spins = 0;
            // Animación rápida de los slots
            const spinInterval = setInterval(() => {
                slot1.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                slot2.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                slot3.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                spins++;

                if (spins > 10) { // Detener la animación después de unos giros
                    clearInterval(spinInterval);
                    evaluateResult();
                }
            }, 50);
        });

        function evaluateResult() {
            totalAttempts++;
            counterSpan.innerText = totalAttempts;

            // LA MAGIA MATEMÁTICA: Generar número entre 1 y 100,000
            const randomChance = Math.floor(Math.random() * 100000) + 1;
            
            // Evaluamos si falló (solo falla si el número es exactamente 1)
            const isFailure = randomChance === 1;

            if (isFailure) {
                // Forzamos los 3 símbolos de falla
                slot1.innerText = failSymbol;
                slot2.innerText = failSymbol;
                slot3.innerText = failSymbol;
                addHistoryLog(totalAttempts, true);
            } else {
                // Forzamos una combinación aleatoria que NO sea triple falla
                // Para simplificar, nos aseguramos de que siempre haya al menos un símbolo seguro
                slot1.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                slot2.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                slot3.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                addHistoryLog(totalAttempts, false);
            }

            // Reactivar el botón
            btn.disabled = false;
            btn.innerText = "Tirar de la palanca";
        }

        function addHistoryLog(attemptId, hasFailed) {
            const li = document.createElement('li');
            li.className = 'history-item';
            
            // Crear ID de usuario falso (para simular el multijugador por ahora)
            const randomUserId = Math.floor(Math.random() * 9000) + 1000;
            
            const timestamp = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second:'2-digit' });

            if (hasFailed) {
                li.innerHTML = `<span>[${timestamp}] User_${randomUserId}</span> <span class="status-fail">¡COLAPSO ESTRUCTURAL! 💥</span>`;
            } else {
                li.innerHTML = `<span>[${timestamp}] User_${randomUserId}</span> <span class="status-safe">Resistió ✓</span>`;
            }

            // Añadir al principio de la lista (arriba de todo)
            historyList.prepend(li);
        }
    </script>
</body>
</html>
