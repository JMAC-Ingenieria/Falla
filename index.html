<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Confiabilidad Estructural</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-color);
            /* Fondo de cuadrícula estilo plano de ingeniería */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.2s ease;
        }

        /* Contenedor Principal */
        .dashboard {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 50px);
        }

        /* Paneles con efecto Vidrio (Glassmorphism) */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Sección Izquierda: Simulador */
        .simulator-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .title-container {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Máquina Tragamonedas Mejorada */
        .slot-machine {
            display: flex;
            gap: 25px;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .slot {
            width: 130px;
            height: 160px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            border: 2px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: filter 0.1s;
        }

        .spinning {
            filter: blur(4px);
        }

        /* Botón de Alta Tecnología */
        .btn-simulate {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        .btn-simulate:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.6);
        }

        .btn-simulate:active {
            transform: translateY(2px);
        }

        .btn-simulate:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Estadísticas en vivo */
        .live-stats {
            margin-top: 30px;
            display: flex;
            gap: 30px;
            text-align: center;
        }

        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Sección Derecha: Registro (Log) */
        .log-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .log-section h3 {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-section h3::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        .log-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 10px;
        }

        /* Estilo de la barra de desplazamiento (Scrollbar) */
        .log-list::-webkit-scrollbar { width: 8px; }
        .log-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .log-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .log-item {
            background: rgba(0,0,0,0.2);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid var(--accent-green);
            animation: slideIn 0.3s ease-out;
        }

        .log-item.fail {
            border-left-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .log-time { color: var(--text-muted); font-family: monospace; }
        .log-status { font-weight: bold; color: var(--accent-green); }
        .log-status.fail { color: var(--accent-red); }

        /* Pie de página académico */
        footer {
            text-align: center;
            padding: 15px;
            background: #0b1120;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .highlight-name {
            color: var(--text-main);
            font-weight: bold;
        }

        /* Animaciones */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Animación de Terremoto (Falla Estructural) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .earthquake {
            animation: shake 0.5s;
            animation-iteration-count: 3;
            background-color: #450a0a !important; /* Fondo rojo oscuro de alerta */
        }

        /* Responsive para celular */
        @media (max-width: 768px) {
            .dashboard { flex-direction: column; height: auto; }
            .slot { width: 80px; height: 100px; font-size: 3rem; }
            .slot-machine { gap: 10px; padding: 15px; }
            .live-stats { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Panel Izquierdo: Simulador -->
        <main class="simulator-section glass-panel">
            <div class="title-container">
                <h1>Confiabilidad Estructural</h1>
                <p class="subtitle">Simulación de Estado Límite Último (1:100,000)</p>
            </div>

            <div class="slot-machine" id="machine">
                <div class="slot" id="slot1">🌉</div>
                <div class="slot" id="slot2">🌉</div>
                <div class="slot" id="slot3">🌉</div>
            </div>

            <button class="btn-simulate" id="leverBtn">Iniciar Simulación</button>
            
            <div class="live-stats">
                <div class="stat-box">
                    <div class="stat-value" id="count-total">0</div>
                    <div class="stat-label">Ensayos Realizados</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="count-fails" style="color: var(--accent-red);">0</div>
                    <div class="stat-label">Fallos Detectados</div>
                </div>
            </div>
        </main>

        <!-- Panel Derecho: Log en Vivo -->
        <aside class="log-section glass-panel">
            <h3>Monitoreo en Tiempo Real</h3>
            <ul class="log-list" id="historyList">
                <!-- Registros inyectados por JS -->
            </ul>
        </aside>
    </div>

    <footer>
        Proyecto Académico | Docente: <span class="highlight-name">Ing. Carlos Achaval</span> | Universidad
    </footer>

    <script>
        const btn = document.getElementById('leverBtn');
        const slots = [document.getElementById('slot1'), document.getElementById('slot2'), document.getElementById('slot3')];
        const historyList = document.getElementById('historyList');
        const countTotalEl = document.getElementById('count-total');
        const countFailsEl = document.getElementById('count-fails');

        // Iconos de ingeniería: Puente, Camión de Carga, Viga, Grúa, Acero
        const safeSymbols = ['🌉', '🚛', '🏗️', '📐', '⚙️'];
        const failSymbol = '💥';

        let totalAttempts = 0;
        let totalFails = 0;

        btn.addEventListener('click', () => {
            btn.disabled = true;
            btn.innerText = "Calculando Cargas...";
            
            // Añadir clase de desenfoque para dar ilusión de velocidad
            slots.forEach(slot => slot.classList.add('spinning'));
            
            let spins = 0;
            const spinInterval = setInterval(() => {
                slots.forEach(slot => {
                    slot.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                });
                spins++;

                if (spins > 15) { // Tiempo de giro
                    clearInterval(spinInterval);
                    slots.forEach(slot => slot.classList.remove('spinning'));
                    evaluateResult();
                }
            }, 60); // Velocidad del giro
        });

        function evaluateResult() {
            totalAttempts++;
            countTotalEl.innerText = totalAttempts;

            // Lógica Matemática: 1 en 100,000
            const randomChance = Math.floor(Math.random() * 100000) + 1;
            const isFailure = randomChance === 1;

            if (isFailure) {
                totalFails++;
                countFailsEl.innerText = totalFails;
                slots.forEach(slot => slot.innerText = failSymbol);
                triggerEarthquake();
                addHistoryLog(true);
            } else {
                // Asegurar combinación segura aleatoria
                slots.forEach(slot => {
                    slot.innerText = safeSymbols[Math.floor(Math.random() * safeSymbols.length)];
                });
                addHistoryLog(false);
            }

            btn.disabled = false;
            btn.innerText = "Iniciar Simulación";
        }

        function triggerEarthquake() {
            // Efecto visual potente cuando hay falla
            document.body.classList.add('earthquake');
            setTimeout(() => {
                document.body.classList.remove('earthquake');
            }, 1500);
        }

        function addHistoryLog(hasFailed) {
            const li = document.createElement('li');
            li.className = `log-item ${hasFailed ? 'fail' : ''}`;
            
            const randomUserId = Math.floor(Math.random() * 90000) + 10000;
            const timestamp = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second:'2-digit', fractionalSecondDigits: 2 });

            const statusHtml = hasFailed 
                ? `<span class="log-status fail">COLAPSO CRÍTICO</span>` 
                : `<span class="log-status">ESTRUCTURA ESTABLE</span>`;

            li.innerHTML = `
                <div>
                    <span class="log-time">[${timestamp}]</span> 
                    ID_Sim_${randomUserId}
                </div>
                ${statusHtml}
            `;

            historyList.prepend(li);
        }
    </script>
</body>
</html>
